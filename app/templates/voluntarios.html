<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pids Tech — Voluntários</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/voluntarios.css') }}" />
</head>

<body>

    <header class="header">
        <a class="header-logo" href="/">Pids<span>Tech</span></a>
        <div class="header-auth">
            <a href="/" class="btn btn-secondary btn-sm">← Voltar ao estoque</a>
        </div>
    </header>

    <div class="page-wrapper">
        <div class="form-card form-card--voluntarios">
            <div class="form-card-header form-card-header--acoes">
                <div>
                    <div class="form-card-titulo">Gerenciar voluntários</div>
                    <div class="form-card-subtitulo">Voluntários cadastrados no sistema</div>
                </div>
                <button id="btn-novo-voluntario" class="btn btn-primary btn-sm">+ Novo voluntário</button>
            </div>
            <div class="form-card-corpo">
                <div id="lista-voluntarios"></div>
            </div>
        </div>
    </div>

    <!-- Modal novo voluntário -->
    <div class="modal-fundo" id="modal-voluntario">
        <div class="modal-caixa modal-caixa--voluntario">
            <div class="modal-topo">
                <span class="modal-titulo">Novo voluntário</span>
                <button class="modal-fechar-btn" id="modal-fechar">✕</button>
            </div>
            <div class="modal-corpo modal-corpo--voluntario">

                <div class="form-secao">
                    <div class="form-secao-titulo">Dados pessoais</div>
                    <div class="campo">
                        <label>Nome completo *</label>
                        <input type="text" id="m-nome" placeholder="Nome completo" />
                    </div>
                    <div class="form-grid-2">
                        <div class="campo">
                            <label>CPF *</label>
                            <input type="text" id="m-cpf" placeholder="000.000.000-00" />
                        </div>
                        <div class="campo">
                            <label>Data de nascimento *</label>
                            <input type="date" id="m-data-nasc" />
                        </div>
                    </div>
                    <div class="campo">
                        <label>Função *</label>
                        <select id="m-funcao">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Técnico">Técnico</option>
                            <option value="Coordenador">Coordenador</option>
                        </select>
                    </div>
                </div>

                <div class="form-secao">
                    <div class="form-secao-titulo">Contato</div>
                    <div class="form-grid-2">
                        <div class="campo">
                            <label>E-mail *</label>
                            <input type="email" id="m-email" placeholder="email@exemplo.com" autocomplete="off"/>
                        </div>
                        <div class="campo">
                            <label>Telefone *</label>
                            <input type="text" id="m-telefone" placeholder="(00) 00000-0000" />
                        </div>
                    </div>
                </div>

                <div class="form-secao">
                    <div class="form-secao-titulo">Endereço</div>
                    <div class="form-grid-2">
                        <div class="campo">
                            <label>CEP *</label>
                            <input type="text" id="m-cep" placeholder="00000-000" />
                        </div>
                        <div class="campo">
                            <label>Número *</label>
                            <input type="text" id="m-numero" placeholder="Ex: 42" />
                        </div>
                    </div>
                    <div class="campo">
                        <label>Rua *</label>
                        <input type="text" id="m-rua" placeholder="Preenchido via CEP" readonly />
                    </div>
                    <div class="form-grid-2">
                        <div class="campo">
                            <label>Bairro *</label>
                            <input type="text" id="m-bairro" placeholder="Preenchido via CEP" readonly />
                        </div>
                        <div class="campo">
                            <label>Cidade *</label>
                            <input type="text" id="m-cidade" placeholder="Preenchida via CEP" readonly />
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="campo">
                            <label>Estado *</label>
                            <input type="text" id="m-estado" placeholder="UF" readonly />
                        </div>
                        <div class="campo">
                            <label>Complemento</label>
                            <input type="text" id="m-complemento" placeholder="Apto, bloco..." />
                        </div>
                    </div>
                </div>

                <div class="form-secao">
                    <div class="form-secao-titulo">Acesso</div>
                    <div class="form-grid-2">
                        <div class="campo">
                            <label for="senha">Senha *</label>
                            <div class="campo-senha-wrapper">
                                <input type="password" id="m-senha" placeholder="Mínimo 8 caracteres" autocomplete="new-password"/>
                                <button type="button" class="toggle-senha" data-target="senha"
                                    aria-label="Mostrar senha">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                                        <circle cx="12" cy="12" r="3" />
                                    </svg>
                                </button>
                            </div>
                            <ul id="requisitos-senha-voluntario" class="requisitos-senha">
                                <li data-requisito="tamanho"><span class="requisito-icone">✕</span> Mínimo 8 caracteres
                                </li>
                                <li data-requisito="maiuscula"><span class="requisito-icone">✕</span> Uma letra
                                    maiúscula</li>
                                <li data-requisito="numero"><span class="requisito-icone">✕</span> Um número</li>
                                <li data-requisito="especial"><span class="requisito-icone">✕</span> Um caractere
                                    especial</li>
                            </ul>
                        </div>
                        <div class="campo">
                            <label for="senha">Confirmar senha *</label>
                            <div class="campo-senha-wrapper">
                                <input type="password" id="m-confirmar-senha" placeholder="Mínimo 8 caracteres" autocomplete="new-password"/>
                                <button type="button" class="toggle-senha" data-target="senha"
                                    aria-label="Mostrar senha">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                                        <circle cx="12" cy="12" r="3" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="modal-rodape modal-rodape--voluntario">
                    <span id="m-mensagem" class="mensagem"></span>
                    <div class="grupo-botoes">
                        <button class="btn btn-secondary-dark btn-sm" id="modal-cancelar">Cancelar</button>
                        <button class="btn btn-primary btn-sm" id="modal-salvar">Cadastrar</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="{{ url_for('static', filename='voluntarios.js') }}"></script>
</body>

</html>
